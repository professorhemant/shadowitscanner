<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadow IT Scanner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #0f172a;
      color: #e2e8f0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1e293b;
    }
    .header-icon { font-size: 20px; }
    .header-title { font-size: 14px; font-weight: 700; color: #fff; }
    .header-sub { font-size: 11px; color: #64748b; margin-top: 1px; }
    .section { padding: 12px 16px; border-bottom: 1px solid #1e293b; }
    .section:last-child { border-bottom: none; }
    .label { font-size: 11px; color: #64748b; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px 10px;
      color: #e2e8f0;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #6366f1; }
    input::placeholder { color: #475569; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-sm { padding: 5px 10px; font-size: 11px; }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-num { font-size: 20px; font-weight: 700; color: #6366f1; }
    .stat-label { font-size: 10px; color: #64748b; margin-top: 2px; }
    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 600;
    }
    .badge-green { background: #14532d; color: #4ade80; }
    .badge-yellow { background: #713f12; color: #fbbf24; }
    .badge-red { background: #450a0a; color: #f87171; }
    .notice {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .notice a { color: #818cf8; text-decoration: none; }
    .flush-row { display: flex; align-items: center; justify-content: space-between; }
    .last-flush { font-size: 10px; color: #475569; }
    #save-status { font-size: 11px; margin-top: 6px; }
    .success-msg { color: #4ade80; }
    .error-msg { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">🛡️</span>
    <div>
      <div class="header-title">Shadow IT Scanner</div>
      <div class="header-sub">Browser extension</div>
    </div>
  </div>

  <!-- Status section -->
  <div class="section" id="status-section">
    <div class="label">Status</div>
    <div class="status-row">
      <span id="status-badge" class="badge badge-yellow">Not configured</span>
      <span id="status-text" style="font-size:11px;color:#64748b">Set up below →</span>
    </div>
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-num" id="stat-pending">–</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-total">–</div>
        <div class="stat-label">Reported</div>
      </div>
    </div>
    <div class="flush-row" style="margin-top:10px">
      <span class="last-flush" id="last-flush-text">Never flushed</span>
      <button class="btn btn-sm btn-primary" id="flush-btn">Send now</button>
    </div>
  </div>

  <!-- Config section -->
  <div class="section">
    <div class="label">Configuration</div>
    <div style="margin-bottom:8px">
      <div class="label" style="margin-bottom:4px">API Token</div>
      <input type="password" id="api-token" placeholder="Paste your API token" />
    </div>
    <div style="margin-bottom:8px">
      <div class="label" style="margin-bottom:4px">Workspace ID</div>
      <input type="text" id="workspace-id" placeholder="e.g. 3 (from dashboard URL)" />
    </div>
    <div style="margin-bottom:10px">
      <div class="label" style="margin-bottom:4px">Backend URL (optional)</div>
      <input type="text" id="api-url" placeholder="https://backend-production-59b25.up.railway.app" />
    </div>
    <button class="btn btn-primary" id="save-btn" style="width:100%;justify-content:center">Save configuration</button>
    <div id="save-status"></div>
  </div>

  <div class="section">
    <div class="notice">
      Find your API token and workspace ID in the <strong>Extension</strong> page of your Shadow IT Scanner dashboard.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
